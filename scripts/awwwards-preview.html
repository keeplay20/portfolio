<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Awwwards cover</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1600px;
        height: 1200px;
        overflow: hidden;
      }

      .cover {
        position: relative;
        width: 1600px;
        height: 1200px;
        background-color: #14110e;
        background-image: url("wood-table-texture.jpg");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 72px;
        padding: 80px 100px;
        font-family: "Geist", system-ui, sans-serif;
        color: #f0ede8;
      }

      .cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
            ellipse 90% 70% at 50% 45%,
            transparent 0%,
            rgba(8, 6, 5, 0.25) 55%,
            rgba(8, 6, 5, 0.55) 100%
          ),
          linear-gradient(
            120deg,
            rgba(8, 6, 5, 0.35) 0%,
            transparent 45%,
            rgba(8, 6, 5, 0.4) 100%
          );
        pointer-events: none;
      }

      .cover__device {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        width: 420px;
        padding: 14px;
        border-radius: 56px;
        background: linear-gradient(
          160deg,
          #242428 0%,
          #121214 14%,
          #030303 32%,
          #0a0a0c 48%,
          #000 58%,
          #141416 72%,
          #1e1e22 100%
        );
        box-shadow:
          0 48px 96px rgba(0, 0, 0, 0.7),
          0 0 0 0.5px rgba(255, 255, 255, 0.28);
        transform: rotate(-4deg);
      }

      .cover__screen {
        position: relative;
        border-radius: 44px;
        overflow: hidden;
        aspect-ratio: 390 / 844;
        background: #000;
      }

      .cover__wallpaper {
        position: absolute;
        inset: 0;
        background-image: url("phone-wallpaper-midnight.jpg");
        background-size: cover;
        background-position: center;
      }

      .cover__wallpaper::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.35) 0%,
          rgba(0, 0, 0, 0.08) 40%,
          rgba(0, 0, 0, 0.45) 100%
        );
      }

      .cover__status {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 28px 12px;
        font-size: 15px;
        font-weight: 600;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      }

      .cover__island {
        width: 88px;
        height: 26px;
        border-radius: 20px;
        background: #000;
      }

      .cover__widget {
        position: relative;
        z-index: 2;
        margin: 12px 18px 0;
        height: 168px;
        border-radius: 22px;
        overflow: hidden;
        background: #1c2836;
      }

      .cover__widget-map {
        position: absolute;
        inset: 0;
        background: linear-gradient(145deg, #1a2f2a, #2d4a3e 45%, #1c2836);
      }

      .cover__widget-name {
        position: absolute;
        left: 18px;
        bottom: 36px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
      }

      .cover__grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px 12px;
        padding: 22px 18px 0;
      }

      .cover__app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .cover__app-icon {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      .cover__app-icon--experience {
        background: linear-gradient(160deg, #000000, #152331);
      }
      .cover__app-icon--settings {
        background: linear-gradient(145deg, #a8a8ad, #8e8e93);
      }
      .cover__app-icon--projects {
        background: linear-gradient(145deg, #0a84ff, #5e5ce6);
      }

      .cover__app-label {
        font-size: 11px;
        opacity: 0.92;
      }

      .cover__dock {
        position: relative;
        z-index: 2;
        margin: 24px 18px 16px;
        padding: 12px 10px;
        border-radius: 26px;
        display: flex;
        justify-content: space-evenly;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(12px);
      }

      .cover__dock .cover__app-icon {
        width: 50px;
        height: 50px;
      }

      .cover__dock .cover__app-icon--mail {
        background: linear-gradient(180deg, #5ac8fa, #0a84ff);
      }
      .cover__dock .cover__app-icon--in {
        background: #0a66c2;
      }
      .cover__dock .cover__app-icon--gh {
        background: linear-gradient(145deg, #30363d, #0d1117);
      }
      .cover__dock .cover__app-icon--about {
        background: linear-gradient(155deg, #ffb340, #ff9500 42%, #ff6b00);
      }

      .cover__dock-apps {
        display: flex;
        justify-content: space-evenly;
        width: 100%;
      }

      .cover__dock-app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .cover__dock-label {
        font-size: 9px;
        opacity: 0.88;
        max-width: 56px;
        text-align: center;
        line-height: 1.15;
      }

      .cover__copy {
        position: relative;
        z-index: 1;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      .cover__eyebrow {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(245, 235, 220, 0.72);
      }

      .cover__title {
        font-size: 72px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.03em;
      }

      .cover__subtitle {
        font-size: 28px;
        line-height: 1.45;
        color: rgba(240, 237, 232, 0.88);
        font-weight: 500;
      }

      .cover__meta {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-size: 17px;
        color: rgba(245, 235, 220, 0.75);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="cover__device">
        <div class="cover__screen">
          <div class="cover__wallpaper" aria-hidden="true"></div>
          <div class="cover__status">
            <span>9:41</span>
            <span class="cover__island"></span>
            <span>●●●</span>
          </div>
          <div class="cover__widget">
            <div class="cover__widget-map"></div>
            <div class="cover__widget-name">Mandar Vyas</div>
          </div>
          <div class="cover__grid">
            <div class="cover__app">
              <div class="cover__app-icon cover__app-icon--experience"></div>
              <span class="cover__app-label">Experience</span>
            </div>
            <div class="cover__app">
              <div class="cover__app-icon cover__app-icon--settings"></div>
              <span class="cover__app-label">Settings</span>
            </div>
            <div class="cover__app">
              <div class="cover__app-icon cover__app-icon--projects"></div>
              <span class="cover__app-label">Projects</span>
            </div>
            <div class="cover__app" aria-hidden="true"></div>
          </div>
          <div class="cover__dock">
            <div class="cover__dock-apps">
              <div class="cover__dock-app">
                <div class="cover__app-icon cover__app-icon--mail"></div>
                <span class="cover__dock-label">Mail</span>
              </div>
              <div class="cover__dock-app">
                <div class="cover__app-icon cover__app-icon--in"></div>
                <span class="cover__dock-label">LinkedIn</span>
              </div>
              <div class="cover__dock-app">
                <div class="cover__app-icon cover__app-icon--gh"></div>
                <span class="cover__dock-label">GitHub</span>
              </div>
              <div class="cover__dock-app">
                <div class="cover__app-icon cover__app-icon--about"></div>
                <span class="cover__dock-label">About Me</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cover__copy">
        <p class="cover__eyebrow">Interactive portfolio</p>
        <h1 class="cover__title">Your resume,<br />one home screen.</h1>
        <p class="cover__subtitle">
          Experience, projects, themes, and About Me on one home screen—built in
          React, TypeScript, and Framer Motion.
        </p>
        <p class="cover__meta">mandarvyas.vercel.app · India</p>
      </div>
    </div>
  </body>
</html>
