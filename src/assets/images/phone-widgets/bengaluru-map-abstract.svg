<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="45%" stop-color="#121a1f"/>
      <stop offset="100%" stop-color="#0d1216"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx="54%" cy="46%" r="42%">
      <stop offset="0%" stop-color="rgba(212,165,116,0.22)"/>
      <stop offset="55%" stop-color="rgba(120,148,132,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(224,200,160,0.18)"/>
      <stop offset="100%" stop-color="rgba(224,200,160,0)"/>
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <rect width="960" height="540" fill="url(#cityGlow)"/>

  <!-- Contour bands -->
  <g fill="none" stroke="rgba(180,150,110,0.14)" stroke-width="1.1">
    <ellipse cx="520" cy="250" rx="340" ry="210" opacity="0.9"/>
    <ellipse cx="500" cy="265" rx="270" ry="165" opacity="0.75"/>
    <ellipse cx="510" cy="275" rx="200" ry="120" opacity="0.55"/>
    <ellipse cx="505" cy="285" rx="135" ry="82" opacity="0.4"/>
  </g>
  <g fill="none" stroke="rgba(100,140,120,0.16)" stroke-width="1">
    <ellipse cx="380" cy="320" rx="220" ry="140" transform="rotate(-12 380 320)"/>
    <ellipse cx="620" cy="210" rx="180" ry="95" transform="rotate(8 620 210)"/>
  </g>

  <!-- Water / tank silhouettes -->
  <path d="M120 360 C200 330 260 370 340 350 S460 310 530 335 S640 380 720 355 L760 420 L80 430 Z" fill="rgba(70,110,120,0.22)"/>
  <path d="M700 120 C760 105 810 130 850 118 L880 170 L670 185 Z" fill="rgba(80,120,130,0.16)"/>

  <!-- Major routes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 280 Q220 220 420 245 T820 210" stroke="rgba(240,237,232,0.1)" stroke-width="2.4"/>
    <path d="M160 120 Q320 180 480 195 T840 160" stroke="rgba(240,237,232,0.07)" stroke-width="1.8"/>
    <path d="M80 400 Q280 360 500 385 T900 350" stroke="rgba(240,237,232,0.08)" stroke-width="2"/>
    <path d="M300 60 Q380 200 460 280 T620 460" stroke="rgba(201,160,107,0.12)" stroke-width="1.6"/>
    <path d="M650 80 Q580 200 520 300 T410 480" stroke="rgba(201,160,107,0.1)" stroke-width="1.4"/>
  </g>

  <!-- Urban grain -->
  <g opacity="0.35" filter="url(#softBlur)">
    <circle cx="490" cy="248" r="2.2" fill="rgba(240,237,232,0.35)"/>
    <circle cx="535" cy="265" r="1.6" fill="rgba(240,237,232,0.28)"/>
    <circle cx="465" cy="275" r="1.4" fill="rgba(240,237,232,0.24)"/>
    <circle cx="512" cy="228" r="1.5" fill="rgba(240,237,232,0.3)"/>
    <circle cx="558" cy="242" r="1.2" fill="rgba(240,237,232,0.22)"/>
    <circle cx="448" cy="238" r="1.3" fill="rgba(240,237,232,0.22)"/>
    <circle cx="520" cy="292" r="1.1" fill="rgba(240,237,232,0.2)"/>
  </g>

  <!-- Ridge highlight -->
  <path d="M0 180 Q240 120 480 150 T960 110 L960 0 L0 0 Z" fill="url(#ridge)" opacity="0.55"/>

  <g opacity="0.25">
    <path d="M0 420 Q320 400 620 430 T960 405" fill="none" stroke="rgba(0,0,0,0.5)" stroke-width="28"/>
  </g>
</svg>